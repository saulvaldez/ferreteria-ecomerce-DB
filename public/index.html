<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛠️ Ferretería Central</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- 🛠️ BARRA SUPERIOR -->
  <header class="barra">
    <h1 class="marca">🛠️ Ferretería Central</h1>
    <div class="sesion">
      <span id="saludo"></span>
      <button id="btn-salir" class="btn btn-claro oculto" onclick="cerrarSesion()">Cerrar sesión</button>
      <button class="btn btn-claro" onclick="abrirModal()">Ingresar</button>
      <button class="btn btn-carrito" onclick="alternarCarrito()">
        🛒 Carrito <span id="contador" class="contador">0</span>
      </button>
    </div>
  </header>

  <!-- 🔔 CAJA DE MENSAJES -->
  <div id="mensaje" class="mensaje oculto"></div>

  <!-- 🛍️ CONTENIDO PRINCIPAL (CATÁLOGO DIRECTO DE CLASE 3) -->
  <main class="contenido">
    <!-- 🔍 Buscador por Nombre -->
    <div class="buscador">
      <input type="text" placeholder="Buscar productos por nombre..." oninput="buscar(this.value)">
    </div>

    <!-- 📂 Categorías -->
    <h2>Categorías</h2>
    <nav id="categorias" class="categorias"></nav>

    <!-- 📦 Catálogo de Productos -->
    <h2>Catálogo de Productos</h2>
    <div id="productos" class="grilla"></div>
  </main>

  <!-- 🛒 PANEL DEL CARRITO -->
  <aside id="carrito" class="carrito oculto">
    <div class="carrito-cabecera">
      <h2>Tu Carrito</h2>
      <button class="btn-cerrar" onclick="alternarCarrito()">×</button>
    </div>
    <ul id="carrito-lista" class="carrito-lista"></ul>
    <div class="carrito-pie">
      <p>Total: <strong id="carrito-total">$0</strong></p>
      <button class="btn btn-principal" onclick="comprar()">Confirmar Compra</button>
    </div>
  </aside>

  <!-- 🔒 MODAL DE LOGIN / REGISTRO -->
  <div id="modal" class="modal oculto">
    <div class="modal-contenido">
      <button class="btn-cerrar" onclick="cerrarModal()">×</button>

      <!-- Formulario Login -->
      <form id="form-login" onsubmit="iniciarSesion(event)">
        <h2>Ingresar</h2>
        <input id="login-email" type="email" placeholder="Email" required>
        <input id="login-password" type="password" placeholder="Contraseña" required>
        <button class="btn btn-principal" type="submit">Ingresar</button>
        <p class="cambiar">¿No tienes cuenta? <a href="#" onclick="mostrarRegistro(true)">Registrate aquí</a></p>
      </form>

      <!-- Formulario Registro -->
      <form id="form-registro" class="oculto" onsubmit="registrar(event)">
        <h2>Crear cuenta</h2>
        <input id="reg-nombre" type="text" placeholder="Nombre completo" required>
        <input id="reg-email" type="email" placeholder="Email" required>
        <input id="reg-password" type="password" placeholder="Contraseña (mínimo 6)" minlength="6" required>
        <button class="btn btn-principal" type="submit">Crear cuenta</button>
        <p class="cambiar">¿Ya tienes cuenta? <a href="#" onclick="mostrarRegistro(false)">Ingresa aquí</a></p>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
